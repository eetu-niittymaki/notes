[package]
name = "notes"
version = "0.1.0"
edition = "2024"

[dependencies]
clap = { version = "4.6.5", features = ["derive"] }
hyper-render = "0.2.2"
owo-colors = "4.3.0"
pulldown-cmark = "0.13.4"
rusqlite = { version = "0.40.1", features = ["bundled"] }
scraper = "0.27.0"
serde_json = "1.0.151"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
