[package]
name = "notes-core"
version = "0.1.0"
edition = "2024"

[dependencies]
libsql = { version = "0.9.30", features = ["remote"]}
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
reqwest = "0.13.4"
scraper = "0.27.0"
pulldown-cmark = "0.13.4"
keyring = "4.1.6"
argon2 = "0.5.3"
jsonwebtoken = { version = "11", features = ["rust_crypto"] }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true