[package]
name = "server"
version = "0.1.0"
edition = "2024"

[dependencies]
notes-core = { path = "../notes-core" }
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread"] }
actix-web = "4.14.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
dotenvy = "0.15.7"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
