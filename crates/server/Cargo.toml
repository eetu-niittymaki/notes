[package]
name = "server"
version = "0.1.0"
edition = "2024"

[dependencies]
notes-core = { path = "../notes-core" }
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread"] }
actix-web = "4.14.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
dotenvy = "0.15.7"
jsonwebtoken = { version = "11", features = ["rust_crypto"] }
base64 = "0.23.1"
argon2 = "0.5.3"
chrono = "0.4.45"
rand = "0.10.2"
futures-util = "0.3.34"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
