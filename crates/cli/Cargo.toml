[package]
name = "cli"
version = "0.2.0"
edition = "2024"

[dependencies]
notes-core = { path = "../notes-core" }
clap = { version = "4.6.5", features = ["derive"] }
enable-ansi-support = "0.3.1"
hyper-render = "0.2.2"
owo-colors = "4.3.0"
pulldown-cmark = "0.13.4"
rfd = "0.17.2"
scraper = "0.27.0"
serde_json = { version = "1.0.151", features = ["preserve_order"] }
tokio = { version = "1.53.1", features = ["full"] }
reqwest = { version = "0.13.4", features = ["json", "query"] }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
